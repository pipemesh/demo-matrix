# demo-matrix — a dogfooding repo for the matrix design (2026-08-11).
# Fake project, real pipeline: three "streams" flow through per-lane
# test → publish edges (matrix as: jobs — one broken stream must never
# block the others), and a CI-style suite runs as one fused node
# (matrix as: workflow — variants succeed or fail as a unit). Every job
# says what it is (job_type:) and what it reads (checkout:): a test lane
# checks out its own stream's file, so editing one stream re-runs only
# that lane.
#
# demo-* repos exercise engine features end-to-end on the production
# instance without touching the pipemesh/pipemesh mainline.
pipeline:
  type: pipeline
  stages:
    - test
    - publish

  jobs:
    # as: jobs (default) — three sibling jobs, each with its own
    # promotion cursor: test[stream=alpha], test[stream=beta], ...
    test:
      job_type: build
      stage: test
      matrix:
        stream:
          - alpha
          - beta
          - gamma
      checkout:
        - "streams/${{ matrix.stream }}.txt"
      produces:
        verified:
          path: "out-${{ matrix.stream }}/verified.txt"
          expire: 7d
      # Each lane's own report: its checks, passing or failing, in the
      # lane's Reports tab. A report is for people: no job consumes it.
      reports:
        checks:
          path: report/checks.md
          title: "Stream ${{ matrix.stream }}"
          expire: 7d
      script: |
        s=${{ matrix.stream }}; f=streams/$s.txt
        echo "testing stream $s"
        mkdir -p report; : > report/rows.md; failed=0
        check() {
          if "${@:2}" >/dev/null 2>&1; then echo "| ✅ | $1 |" >> report/rows.md
          else echo "| ❌ | $1 |" >> report/rows.md; failed=$((failed + 1)); fi
        }
        check "$f exists" test -f "$f"
        check "it names its stream ($s)" grep -q "^stream: $s$" "$f"
        check "it carries a payload" grep -q "^payload: " "$f"
        { if [ "$failed" -eq 0 ]; then echo "# ✅ Stream $s verified"; else echo "# ❌ Stream $s: $failed checks failed"; fi
          printf '\n| | Check |\n|---|---|\n'; cat report/rows.md
          printf '\n```\n%s\n```\n' "$(cat "$f" 2>/dev/null)"; } > report/checks.md
        [ "$failed" -eq 0 ] || { echo "stream $s failed $failed checks (see its report)"; exit 1; }
        mkdir -p out-${{ matrix.stream }}
        cp streams/${{ matrix.stream }}.txt out-${{ matrix.stream }}/verified.txt
        echo "verified-at: $CI_COMMIT_SHA" >> out-${{ matrix.stream }}/verified.txt

    # as: workflow — the GHA-style CI matrix: one node over a GENERATED
    # child workflow; downstream sees a single verdict.
    suite:
      job_type: build
      stage: test
      matrix:
        check:
          - lint
          - unit
        as: workflow
      checkout:
        - streams
      # Each variant of the generated workflow reports too.
      reports:
        suite:
          path: suite.md
          title: "Suite: ${{ matrix.check }}"
          expire: 7d
      script: |
        echo "suite ${{ matrix.check }} across all streams"
        { echo "# ${{ matrix.check }} across all streams"; echo; echo "| Stream | Result |"; echo "|---|---|"; } > suite.md
        for f in streams/*.txt; do
          echo "  ${{ matrix.check }}: $f ok"
          echo "| \`$f\` | ✅ ok |" >> suite.md
        done

    # Lane-to-lane promotion: each publish variant consumes ONLY its own
    # stream's test entry, and that is its whole dependency — an explicit
    # dependency replaces the stage gate, so a red beta lane leaves alpha
    # and gamma shipping. A deploy checks out nothing: it ships when its
    # lane's entry changed.
    publish:
      job_type: deploy
      production: true
      stage: publish
      matrix:
        stream:
          - alpha
          - beta
          - gamma
      consumes:
        VERIFIED: "test[stream=${{ matrix.stream }}]/verified"
      script: |
        echo "publishing stream ${{ matrix.stream }}"
        cat out-${{ matrix.stream }}/verified.txt
        echo "published ${{ matrix.stream }}"

pipemesh:
  pipelines:
    pipeline: !ref pipeline
